name: Tablewise startup JavaScript syntax
on:
  pull_request:
    paths:
      - 'index.html'
      - 'luxury-v2/**'
      - 'tests/luxury-v2-save-confirmation-status.test.mjs'
      - 'tests/session-restore-guard.cjs'
      - 'tests/rapid-edits-account-switch.cjs'
      - 'tests/current-save-failure-scenarios.cjs'
      - 'tests/cloud-save-conflict-status.cjs'
      - 'tests/cloud-revision-guard.cjs'
      - 'tests/recovery-conflict-status.cjs'
      - 'tests/guarded-cloud-save.cjs'
      - 'tests/startup-recovered-cloud.cjs'
      - 'tests/restore-firestore-shape.cjs'
      - 'tests/guarded-meal-restore.cjs'
      - 'tests/backup-export.cjs'
      - 'tests/local-backup-shape.cjs'
      - 'tests/local-backup-inspection.cjs'
      - 'tests/auth-recovery-messages.cjs'
      - '.github/workflows/app-syntax.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/session-restore-guard.cjs'
      - 'tests/rapid-edits-account-switch.cjs'
      - 'tests/current-save-failure-scenarios.cjs'
      - 'tests/cloud-save-conflict-status.cjs'
      - 'tests/cloud-revision-guard.cjs'
      - 'tests/recovery-conflict-status.cjs'
      - 'tests/guarded-cloud-save.cjs'
      - 'tests/startup-recovered-cloud.cjs'
      - 'tests/restore-firestore-shape.cjs'
      - 'tests/guarded-meal-restore.cjs'
      - 'tests/backup-export.cjs'
      - 'tests/local-backup-shape.cjs'
      - 'tests/local-backup-inspection.cjs'
      - 'tests/auth-recovery-messages.cjs'
      - '.github/workflows/app-syntax.yml'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject jerky for fresh meat ingredients
        run: node tests/kroger-fresh-meat-match.test.mjs
      - name: Check real calendar weeks and Sunday rollover
        run: node tests/luxury-calendar-weeks.test.mjs && node tests/luxury-cloud-calendar.test.mjs && node tests/luxury-renewal-safety.test.mjs && node tests/luxury-renewal-generator.test.mjs && node tests/luxury-renewal-commit.test.mjs && node tests/luxury-renewal-verify.test.mjs
      - name: Verify compact save card and recovery protection
        run: node tests/luxury-v2-compact-save-card.test.mjs
      - name: Verify live luxury save confirmation states
        run: node tests/luxury-v2-save-confirmation-status.test.mjs
      - name: Validate production entry and luxury module
        run: |
          node --input-type=module --check < luxury-v2/live.js
          node --input-type=module --check < luxury-v2/catalog.js
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const root=readFileSync('index.html','utf8');
          const html=readFileSync('luxury-v2/index.html','utf8');
          const app=readFileSync('luxury-v2/live.js','utf8');
          assert.ok(root.includes("location.replace(new URL('./luxury-v2/index.html'"));
          assert.match(html,/src="\.\/live\.js\?v=compact-save-20261025"/);
          assert.match(app,/onAuthStateChanged\(auth/);
          assert.match(app,/getDocFromServer/);
          assert.match(app,/verifyLuxurySavedPlan/);
          assert.match(app,/const LUXURY_SAVES_RELEASED=true;/);
          console.log('PASS: same-origin entry, signed-in restore, guarded cloud save and module syntax');
          NODE
