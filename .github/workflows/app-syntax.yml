name: Tablewise startup JavaScript syntax
on:
  pull_request:
    paths:
      - 'index.html'
      - 'tests/cloud-revision-guard.cjs'
      - 'tests/recovery-conflict-status.cjs'
      - 'tests/guarded-cloud-save.cjs'
      - 'tests/startup-recovered-cloud.cjs'
      - 'tests/restore-firestore-shape.cjs'
      - 'tests/guarded-meal-restore.cjs'
      - 'tests/backup-export.cjs'
      - 'tests/local-backup-shape.cjs'
      - 'tests/local-backup-inspection.cjs'
      - 'tests/auth-recovery-messages.cjs'
      - '.github/workflows/app-syntax.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/cloud-revision-guard.cjs'
      - 'tests/recovery-conflict-status.cjs'
      - 'tests/guarded-cloud-save.cjs'
      - 'tests/startup-recovered-cloud.cjs'
      - 'tests/restore-firestore-shape.cjs'
      - 'tests/guarded-meal-restore.cjs'
      - 'tests/backup-export.cjs'
      - 'tests/local-backup-shape.cjs'
      - 'tests/local-backup-inspection.cjs'
      - 'tests/auth-recovery-messages.cjs'
      - '.github/workflows/app-syntax.yml'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect original account sign-in recovery
        run: node tests/auth-recovery-messages.cjs
      - name: Check local recovery read-only protection
        run: node tests/local-backup-inspection.cjs
      - name: Check local backup structure diagnostic
        run: node tests/local-backup-shape.cjs
      - name: Check read-only backup export
        run: node tests/backup-export.cjs
      - name: Validate guarded meal restoration
        run: node tests/guarded-meal-restore.cjs
      - name: Validate Firestore restore shape
        run: node tests/restore-firestore-shape.cjs
      - name: Check cloud recovery startup
        run: node tests/startup-recovered-cloud.cjs
      - name: Check guarded cloud save
        run: node tests/guarded-cloud-save.cjs
      - name: Validate recovery conflict messaging
        run: node tests/recovery-conflict-status.cjs
      - name: Validate multi-device revision guard
        run: node tests/cloud-revision-guard.cjs
      - name: Check inline JavaScript syntax
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const html = readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw Error('No inline scripts found');
          for (const [i, match] of scripts.entries()) {
            const result = spawnSync('node', ['--check', '--input-type=module'], { input: match[1], encoding: 'utf8' });
            if (result.status !== 0) {
              process.stderr.write('Inline script ' + (i + 1) + ': ' + result.stderr);
              process.exit(1);
            }
          }
          console.log('All ' + scripts.length + ' inline scripts parsed');
          NODE
