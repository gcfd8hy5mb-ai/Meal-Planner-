name: Kroger Worker Validation

on:
  push:
    branches:
      - prepare-kroger-worker-github
    paths:
      - 'cloudflare/kroger/**'
      - 'wrangler.jsonc'
      - '.github/workflows/kroger-worker-validation.yml'
  pull_request:
    paths:
      - 'cloudflare/kroger/**'
      - 'wrangler.jsonc'
      - '.github/workflows/kroger-worker-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check cloudflare/kroger/worker.js
      - name: Read-only rollback verifier syntax and safety gate
        run: |
          node --check ops/tablewise-kroger/verify-rollback-readiness.mjs
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const src=fs.readFileSync('ops/tablewise-kroger/verify-rollback-readiness.mjs','utf8');
          assert.match(src,/deployAllowed:false/);
          assert.match(src,/privateRestorableBackupVerified:false/);
          assert.match(src,/rollbackExerciseVerified:false/);
          assert.doesNotMatch(src,/method:\\s*['\"](?:POST|PUT|PATCH|DELETE)['\"]/);
          console.log('Rollback verifier remains read-only and fail-closed');
          NODE
      - name: Worker request tests
        run: node --test cloudflare/kroger/tests/*.test.mjs
      - name: Wrangler configuration shape
        run: |
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));if(c.name!=='tablewise-kroger'||c.main!=='cloudflare/kroger/worker.js'||c.kv_namespaces?.[0]?.binding!=='KROGER_KV'||!c.kv_namespaces?.[0]?.id)process.exit(1)"
      - name: Wrangler dry validation
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/kroger-worker-build
