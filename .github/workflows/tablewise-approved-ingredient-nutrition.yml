name: Tablewise verified ingredient nutrition QA
on:
  pull_request:
    paths:
      - 'ops/recipe-expansion/ingredient-nutrition-sources.json'
      - 'ops/recipe-expansion/batch-01-recipe-drafts.json'
      - 'ops/recipe-expansion/audit-approved-ingredient-inputs.mjs'
      - 'ops/recipe-expansion/validate-premerge-nutrition.mjs'
      - 'ops/recipe-expansion/test-nutrition-release-gate.mjs'
      - 'ops/recipe-expansion/calculate-verified-nutrition.mjs'
      - 'ops/recipe-expansion/nutrition-required-conversions.json'
      - '.github/workflows/tablewise-approved-ingredient-nutrition.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  approved-ingredient-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit approved USDA nutrition inputs and hold incomplete meals
        run: node ops/recipe-expansion/audit-approved-ingredient-inputs.mjs
      - name: Confirm flagged nutrition stays excluded from recipe totals
        run: node ops/recipe-expansion/test-nutrition-release-gate.mjs
      - name: Run nutrition release gate (must block incomplete meals)
        run: node ops/recipe-expansion/validate-premerge-nutrition.mjs
      - name: Upload evidence and readiness audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tablewise-approved-ingredient-nutrition
          path: ops/recipe-expansion/approved-ingredient-audit.json
          retention-days: 30
