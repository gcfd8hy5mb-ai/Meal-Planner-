name: Tablewise luxury production staging
on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Type DEPLOY-STAGING to publish ONLY the separate Tablewise staging site'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: tablewise-luxury-production-staging
  cancel-in-progress: false
jobs:
  deploy-staging:
    if: ${{ github.ref_name == 'main' && inputs.approval == 'DEPLOY-STAGING' }}
    runs-on: ubuntu-latest
    environment: tablewise-preview-deploy
    timeout-minutes: 25
    steps:
      - name: Checkout frozen and iPhone-approved luxury candidate
        uses: actions/checkout@v4
        with:
          ref: b67fceb0b4a734f8b751909e417aeaf00975a3a1
          persist-credentials: false
      - name: Validate isolated artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'b67fceb0b4a734f8b751909e417aeaf00975a3a1'
          test -f luxury-v2/index.html
          test -f luxury-v2/live.js
          test -d assets/meal-photos
          node --input-type=module --check < luxury-v2/live.js
          grep -q 'const LUXURY_SAVES_RELEASED=true;' luxury-v2/live.js
          node tests/luxury-v2-cold-start.cjs
          node --test tests/luxury-v2-meal-preview.test.mjs tests/luxury-v2-groceries.test.mjs tests/luxury-v2-checklist.test.mjs tests/luxury-cook-macros.test.mjs
      - name: Assemble allowlisted staging artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tablewise-staging
          cp -a luxury-v2 assets .tablewise-staging/
          printf '%s\n' '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=/luxury-v2/index.html"><title>Tablewise staging</title><a href="/luxury-v2/index.html">Open Tablewise staging</a></html>' > .tablewise-staging/index.html
          test ! -e .tablewise-staging/firestore.rules
          test ! -e .tablewise-staging/wrangler.jsonc
          test ! -e .tablewise-staging/.github
      - name: Verify distinct pre-existing staging project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/tablewise-luxury-staging" > /tmp/tablewise-staging-project.json
          node -e "const p=require('/tmp/tablewise-staging-project.json');if(!p.success||p.result?.name!=='tablewise-luxury-staging')process.exit(1)"
      - name: Publish staging only (never live Pages or Kroger Worker)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.45.0 pages deploy .tablewise-staging --project-name tablewise-luxury-staging --branch main
      - name: Verify staged HTML
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 3 https://main.tablewise-luxury-staging.pages.dev/luxury-v2/index.html -o /tmp/tablewise-staging.html
          grep -q 'id="luxuryPantryShortcut"' /tmp/tablewise-staging.html
          echo "Verified staging artifact b67fceb0b4a734f8b751909e417aeaf00975a3a1; live GitHub Pages and preview are unchanged."
