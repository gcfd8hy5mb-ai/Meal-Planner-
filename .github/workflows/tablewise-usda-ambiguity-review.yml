name: USDA three ambiguous ingredients
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/tablewise-usda-ambiguity-review.yml'
      - 'ops/recipe-expansion/review-three-ambiguous-ingredients.mjs'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve USDA alternatives and inspect recipe usage
        env:
          USDA_FDC_API_KEY: ${{ secrets.USDA_FDC_API_KEY }}
        run: node ops/recipe-expansion/review-three-ambiguous-ingredients.mjs
      - name: Preserve manual-review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tablewise-usda-cumin-onion-lime-evidence
          path: ops/recipe-expansion/usda-three-ambiguities-review.json
          retention-days: 30
