name: Prepare USDA recipe nutrition candidates
on:
  workflow_dispatch:
  push:
    branches:
      - feature/recipe-expansion-110-content-20261021
    paths:
      - '.github/workflows/tablewise-usda-nutrition-candidates.yml'
      - 'ops/recipe-expansion/suggest-usda-food-matches.mjs'
permissions:
  contents: read
jobs:
  nutrition-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test real USDA API lookup on first 10 ingredients
        env:
          USDA_FDC_API_KEY: ${{ secrets.USDA_FDC_API_KEY }}
        run: node ops/recipe-expansion/suggest-usda-food-matches.mjs 10
      - name: Upload review-only lookup report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tablewise-usda-api-review-candidates
          path: ops/recipe-expansion/usda-food-suggestions.json
          if-no-files-found: warn
          retention-days: 14
