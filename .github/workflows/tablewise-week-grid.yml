name: Tablewise approved weekly grid validation
on:
  push:
    branches:
      - design/approved-compact-week-grid-20261022
  pull_request:
    paths:
      - 'luxury-v2/**'
      - '.github/workflows/tablewise-week-grid.yml'
permissions:
  contents: read
jobs:
  week-grid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check luxury-v2/approved-week-grid.test.mjs
      - run: node --test luxury-v2/approved-week-grid.test.mjs luxury-v2/quick-meal-filters.test.mjs
